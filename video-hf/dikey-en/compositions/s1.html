  <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
    <div class="bg-glow" data-layout-ignore></div>
    <div class="bg-dots" data-layout-ignore></div>

    <div class="safe-zone">
      <div class="header-block">
        <div class="eyebrow">
          <span class="eyebrow-dot"></span>
          <span>WINDOWS VOICE DICTATION</span>
        </div>
        <h1 class="headline">Still typing everything manually?</h1>
        <p class="subtitle">Hold Right Ctrl. Speak. Done.</p>
      </div>

      <div class="mic-stage">
        <svg id="s1-wave-svg" class="mic-svg" viewBox="0 0 820 380" width="820" height="380">
          <defs>
            <linearGradient id="s1WaveGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.85" />
              <stop offset="50%" stop-color="#4F6DFF" stop-opacity="1" />
              <stop offset="100%" stop-color="#3D5BF5" stop-opacity="0.85" />
            </linearGradient>
          </defs>
          <g id="s1-bars"></g>
        </svg>

          <div class="halo-outer"></div>
          <div class="halo-inner"></div>
        </div>

        <div id="s1-orb" class="orb-wrap">
          <div id="s1-orb-idle" class="orb-idle"></div>

              <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#F2F5FC" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" x2="12" y1="19" y2="22"/>

        </div>
        <div id="s1-status" class="status-line">Listening — English (Local)</div>
      </div>

  <script>
    const LEFT_PROFILE = [
      0.07, 0.08, 0.08, 0.11, 0.15, 0.12, 0.2, 0.25, 0.18, 0.3, 0.38, 0.44, 0.32,
      0.56, 0.68, 0.5, 0.74, 0.88, 0.62, 0.94, 0.82, 0.72, 0.58, 0.48
    ];
    const RIGHT_PROFILE = [
      0.52, 0.64, 0.78, 0.88, 0.95, 0.68, 0.82, 0.72, 0.54, 0.62, 0.44, 0.36, 0.48,
      0.34, 0.26, 0.22, 0.28, 0.18, 0.14, 0.12, 0.09, 0.08, 0.08, 0.06
    ];
    const IDLE_HEIGHTS = LEFT_PROFILE.concat(RIGHT_PROFILE);
    const BARS_PER_SIDE = 24;
    const TOTAL_BARS = 48;
    const centerX = 410;
    const centerY = 164;
    const idleStep = 9.8;
    const idleInnerGap = 132;
    const activeStep = 9.6;
    const activeStartX = centerX - ((TOTAL_BARS - 1) * activeStep) / 2;

    const barsGroup = document.getElementById("s1-bars");
    const NS = "http://www.w3.org/2000/svg";
    const barEls = [];

    for (let i = 0; i < TOTAL_BARS; i++) {
      const isLeft = i < BARS_PER_SIDE;
      const idleX = isLeft
        ? centerX - idleInnerGap - (BARS_PER_SIDE - 1 - i) * idleStep
        : centerX + idleInnerGap + (i - BARS_PER_SIDE) * idleStep;
      const idleH = Math.max(6, IDLE_HEIGHTS[i] * 78);
      const rect = document.createElementNS(NS, "rect");
      rect.setAttribute("x", (idleX - 2).toFixed(2));
      rect.setAttribute("y", (centerY - idleH / 2).toFixed(2));
      rect.setAttribute("width", "4");
      rect.setAttribute("height", idleH.toFixed(2));
      rect.setAttribute("rx", "2");
      rect.setAttribute("fill", "url(#s1WaveGrad)");
      rect.setAttribute("opacity", "0.88");
      barsGroup.appendChild(rect);
      barEls.push({ el: rect, idleX, idleH, activeX: activeStartX + i * activeStep });
    }

    const tl = gsap.timeline({ paused: true });

    tl.fromTo(
      "#s1-keycap",
      { scale: 1, y: 0, borderColor: "rgba(255, 255, 255, 0.16)", boxShadow: "0 12px 0 #070A12, 0 20px 40px rgba(0,0,0,0.5)" },
      { scale: 0.94, y: 8, borderColor: "#4F6DFF", boxShadow: "0 4px 0 #070A12, 0 0 36px rgba(79,109,255,0.45)", duration: 0.18, ease: "power2.out" },
      0.4
    );
    tl.fromTo(
      "#s1-key-dot",
      { backgroundColor: "#64748B", boxShadow: "none" },
      { backgroundColor: "#EF4444", boxShadow: "0 0 14px #EF4444", duration: 0.18 },
      0.4
    );
    tl.fromTo(
      "#s1-status",
      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" },
      0.55
    );

    tl.fromTo(
      "#s1-halo",
      { opacity: 1, scale: 1 },
      { opacity: 0, scale: 0.35, y: 112, duration: 0.35, ease: "power3.inOut" },
      0.4
    );
    tl.fromTo(
      "#s1-orb",
      { y: 0, scale: 1 },
      { y: 112, scale: 0.44, duration: 0.38, ease: "power3.inOut" },
      0.4
    );
    tl.fromTo("#s1-orb-idle", { opacity: 1 }, { opacity: 0, duration: 0.3 }, 0.4);
    tl.fromTo("#s1-orb-rec", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4);
    tl.fromTo("#s1-mic-icon", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.35, duration: 0.25 }, 0.4);
    tl.fromTo("#s1-stop-sq", { opacity: 0, scale: 0.35 }, { opacity: 1, scale: 1, duration: 0.3 }, 0.48);

    const steps = [0.75, 1.2, 1.65, 2.1, 2.55, 2.95];
    barEls.forEach((b, i) => {
      const normCenter = Math.abs(i - (TOTAL_BARS - 1) / 2) / ((TOTAL_BARS - 1) / 2);
      const env = Math.pow(1 - normCenter * 0.76, 1.32);

      const h0 = Math.max(10, 18 + ((Math.sin(i * 0.45) + 1.2) / 2.2) * 118 * env);
      tl.fromTo(
        b.el,
        { attr: { x: b.idleX - 2, y: centerY - b.idleH / 2, height: b.idleH, width: 4 } },
        { attr: { x: b.activeX - 2.2, y: centerY - h0 / 2, height: h0, width: 4.4 }, duration: 0.35, ease: "power3.out" },
        0.4
      );

      steps.forEach((t) => {
        const wave = (Math.sin(t * 5.2 - i * 0.36) + Math.cos(t * 3.1 + i * 0.22) + 2.0) / 4.0;
        const h = Math.max(10, 14 + wave * 126 * env);
        tl.to(
          b.el,
          { attr: { y: centerY - h / 2, height: h }, duration: 0.42, ease: "sine.inOut" },
          t
        );
      });
    });

    window.__timelines["s1"] = tl;
    tl.seek(0);
  </script>
