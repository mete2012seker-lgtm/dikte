  <script>
    (function () {
      const root = document.getElementById("root");
      const barsGroup = root.querySelector("#s1-bars-group");
      const waveSvg = root.querySelector("#s1-wave-svg");
      const haloWrap = root.querySelector("#s1-halo-wrap");
      const orbWrap = root.querySelector("#s1-orb-wrap");
      const orbIdle = root.querySelector("#s1-orb-idle");
      const orbRec = root.querySelector("#s1-orb-rec");
      const micSvg = root.querySelector("#s1-mic-svg");
      const stopSq = root.querySelector("#s1-stop-sq");
      const keycap = root.querySelector("#s1-keycap");
      const keycapWrap = root.querySelector("#s1-keycap-wrap");
      const statusDot = root.querySelector("#s1-status-dot");
      const statusText = root.querySelector("#s1-status-text");

      const BARS_PER_SIDE = 24;
      const TOTAL_BARS = 48;
      const LEFT_PROFILE = [0.07, 0.08, 0.08, 0.11, 0.15, 0.12, 0.2, 0.25, 0.18, 0.3, 0.38, 0.44, 0.32, 0.56, 0.68, 0.5, 0.74, 0.88, 0.62, 0.94, 0.82, 0.72, 0.58, 0.48];
      const RIGHT_PROFILE = [0.52, 0.64, 0.78, 0.88, 0.95, 0.68, 0.82, 0.72, 0.54, 0.62, 0.44, 0.36, 0.48, 0.34, 0.26, 0.22, 0.28, 0.18, 0.14, 0.12, 0.09, 0.08, 0.08, 0.06];
      const IDLE_HEIGHTS = LEFT_PROFILE.concat(RIGHT_PROFILE);

      const centerX = 410;
      const centerY = 164;
      const idleStep = 9.8;
      const idleInnerGap = 132;
      const activeStep = 9.6;
      const activeStartX = centerX - ((TOTAL_BARS - 1) * activeStep) / 2;

      const mix = (a, b, t) => a + (b - a) * t;
      const clamp01 = (v) => Math.max(0, Math.min(1, v));

      const rects = [];
      const svgNS = "http://www.w3.org/2000/svg";
      for (let i = 0; i < TOTAL_BARS; i++) {
        const rect = document.createElementNS(svgNS, "rect");
        rect.setAttribute("fill", "url(#s1WaveGrad)");
        barsGroup.appendChild(rect);
        rects.push(rect);
      }

      const state = { timeSec: 0, morph: 0, energy: 0.4 };

      function renderWave() {
        const m = clamp01(state.morph);
        const timeSec = state.timeSec;
        const energy = state.energy;
        const barWidth = mix(3.8, 4.4, m);
        const orbOffsetY = m * 124;
        const orbScale = mix(1, 0.41, m);
        const haloScale = mix(1, 0.32, m);
        const haloOpacity = 1 - m;
        const idleBreath = 1 + Math.sin(timeSec * 1.36) * 0.015 * (1 - m);

        waveSvg.style.filter = "drop-shadow(0 0 " + mix(6, 14, m).toFixed(1) + "px rgba(76, 107, 255, 0.42))";

        for (let i = 0; i < TOTAL_BARS; i++) {
          const isLeft = i < BARS_PER_SIDE;
          const idleX = isLeft
            ? centerX - idleInnerGap - (BARS_PER_SIDE - 1 - i) * idleStep
            : centerX + idleInnerGap + (i - BARS_PER_SIDE) * idleStep;
          const activeX = activeStartX + i * activeStep;
          const x = mix(idleX, activeX, m);

          const sideDist = isLeft
            ? (BARS_PER_SIDE - 1 - i) / (BARS_PER_SIDE - 1)
            : (i - BARS_PER_SIDE) / (BARS_PER_SIDE - 1);

          const ambientWave1 = Math.sin(timeSec * 2.4 - sideDist * 5.2);
          const ambientWave2 = Math.cos(timeSec * 1.5 + sideDist * 3.1) * 0.5;
          const ambientFactor = 0.84 + 0.32 * ((ambientWave1 + ambientWave2 + 1.5) / 3.0);
          const ambientFloor = (1 - sideDist * 0.75) * (4 + 4 * Math.sin(timeSec * 2.8 - sideDist * 4.5));
          const idleH = Math.max(4, IDLE_HEIGHTS[i] * 74 * ambientFactor + ambientFloor);

          const normCenter = Math.abs(i - (TOTAL_BARS - 1) / 2) / ((TOTAL_BARS - 1) / 2);
          const centerEnvelope = Math.pow(1 - normCenter * 0.76, 1.32);

          const wave1 = Math.sin(timeSec * 5.4 - i * 0.34);
          const wave2 = Math.sin(timeSec * 8.8 + i * 0.52) * 0.6;
          const wave3 = Math.cos(timeSec * 3.2 - i * 0.18) * 0.5;
          const syllablePulse = 0.56 + 0.44 * Math.sin(timeSec * 2.7 + Math.sin(timeSec * 1.3));
          const combined = (wave1 + wave2 + wave3 + 2.1) / 4.2;
          const activeH = 12 + combined * 124 * energy * centerEnvelope * syllablePulse;

          const barH = Math.max(4, mix(idleH, activeH, m));
          const alpha = mix(0.88, 1.0, m);

          const r = rects[i];
          r.setAttribute("x", (x - barWidth / 2).toFixed(2));
          r.setAttribute("y", (centerY - barH / 2).toFixed(2));
          r.setAttribute("width", barWidth.toFixed(2));
          r.setAttribute("height", barH.toFixed(2));
          r.setAttribute("rx", (barWidth / 2).toFixed(2));
          r.setAttribute("opacity", alpha.toFixed(2));
        }

        haloWrap.style.transform = "translateY(" + orbOffsetY.toFixed(2) + "px) scale(" + (haloScale * idleBreath).toFixed(4) + ")";
        haloWrap.style.opacity = haloOpacity.toFixed(3);

        orbWrap.style.transform = "translateY(" + orbOffsetY.toFixed(2) + "px) scale(" + (orbScale * idleBreath).toFixed(4) + ")";
        orbIdle.style.opacity = (1 - m).toFixed(3);
        orbRec.style.opacity = m.toFixed(3);

        micSvg.style.opacity = Math.max(0, 1 - m * 1.45).toFixed(3);
        micSvg.style.transform = "scale(" + mix(1, 0.35, m).toFixed(3) + ") rotate(" + mix(0, -18, m).toFixed(2) + "deg)";

        stopSq.style.opacity = clamp01((m - 0.15) * 1.35).toFixed(3);
        stopSq.style.transform = "scale(" + mix(0.25, 1, m).toFixed(3) + ") rotate(" + mix(18, 0, m).toFixed(2) + "deg)";

        statusText.textContent = m > 0.35 ? "Dinliyor..." : "Bas-Konuş";
      }

      renderWave();

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { timeSec: 0 }, { timeSec: 4, duration: 4, ease: "none", onUpdate: renderWave }, 0);
      tl.fromTo(state, { morph: 0, energy: 0.4 }, { morph: 1, energy: 1.05, duration: 0.45, ease: "power3.out", onUpdate: renderWave }, 0.6);

      tl.fromTo(
        keycap,
        { y: 0, scale: 1, boxShadow: "0 6px 0 #070b16, 0 0 20px rgba(79, 109, 255, 0.25)" },
        { y: 4, scale: 0.96, boxShadow: "0 2px 0 #070b16, 0 0 32px rgba(239, 68, 68, 0.55)", duration: 0.18, ease: "power2.out" },
        0.55
      );
      tl.fromTo(
        keycapWrap,
        { borderColor: "rgba(255, 255, 255, 0.12)" },
        { borderColor: "rgba(239, 68, 68, 0.55)", duration: 0.22, ease: "power2.out" },
        0.58
      );
      tl.fromTo(
        statusDot,
        { backgroundColor: "#4f6dff", boxShadow: "0 0 12px #4f6dff" },
        { backgroundColor: "#ef4444", boxShadow: "0 0 16px #ef4444", duration: 0.2, ease: "power2.out" },
        0.6
      );

      window.__timelines["s1"] = tl;
    })();
  </script>
