  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo(
      "#s3-header",
      { opacity: 0, y: 24 },
      { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      0
    );

    tl.fromTo(
      "#s3-card",
      { opacity: 0, y: 30, scale: 0.96 },
      { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" },
      0.08
    );

    // At 0.7s (abs 9.2s): switch Hold -> Toggle & update hotkey
    tl.fromTo(
      "#s3-seg-ind",
      { x: 0 },
      { x: 356, duration: 0.32, ease: "power3.inOut" },
      0.7
    );
    tl.fromTo(
      "#s3-hotkey",
      { scale: 1 },
      {
        scale: 1.08,
        duration: 0.16,
        yoyo: true,
        repeat: 1,
        onStart: () => {
          document.getElementById("s3-hotkey").textContent = "Ctrl + Shift + D";
        },
      },
      1.1
    );

    // At 2.7s (abs 11.2s): card dims and floating mini pill zooms into focus
    tl.to(
      "#s3-card",
      { opacity: 0.48, scale: 0.94, duration: 0.38, ease: "power2.out" },
      2.7
    );

    tl.fromTo(
      "#s3-floating-pill",
      { opacity: 0, scale: 0.78, y: 30 },
      { opacity: 1, scale: 1.06, y: 0, duration: 0.38, ease: "back.out(1.6)" },
      2.7
    );

    // At 4.0s (abs 12.5s): Dinliyor... -> Yazıyor... (sequential so no overlap)
    tl.to(
      "#s3-text-listen",
      { opacity: 0, y: -12, duration: 0.16, ease: "power2.in" },
      4.0
    );
    tl.fromTo(
      "#s3-text-write",
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" },
      4.2
    );
    tl.fromTo(
      "#s3-pill-dot",
      { backgroundColor: "#4F6DFF", boxShadow: "0 0 18px #4F6DFF" },
      { backgroundColor: "#22C55E", boxShadow: "0 0 20px #22C55E", duration: 0.25 },
      4.15
    );
    tl.fromTo(
      "#s3-floating-pill",
      { borderColor: "#4F6DFF" },
      { borderColor: "#22C55E", duration: 0.25 },
      4.15
    );

    window.__timelines["s3"] = tl;
    tl.seek(0);
  </script>
